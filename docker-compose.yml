version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
